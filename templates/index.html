<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>URL Shortener</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 60px auto; padding: 0 16px; }
    input, button { padding: 10px; font-size: 16px; margin: 4px 0; width: 100%; box-sizing: border-box; }
    button { cursor: pointer; }
    #result { margin-top: 16px; word-break: break-all; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>URL Shortener</h1>
  <input id="url" placeholder="Paste a long URL (https://...)">
  <input id="alias" placeholder="Custom alias (optional)">
  <button id="go">Shorten</button>
  <div id="result"></div>

  <script>
    document.getElementById("go").onclick = async () => {
      const out = document.getElementById("result");
      const res = await fetch("/shorten", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          url: document.getElementById("url").value,
          alias: document.getElementById("alias").value
        })
      });
      const data = await res.json();
      out.className = res.ok ? "" : "error";
      out.innerHTML = "";
      if (res.ok) {
        const a = document.createElement("a");
        a.href = data.short_url; a.textContent = data.short_url;
        out.append("Your short link: ", a);
      } else {
        out.textContent = data.error;
      }
    };
  </script>
</body>
</html>
